<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Flowers to the Moon - Fluistervelden Prototype v8.3</title>
  <link rel="stylesheet" href="./style.css?v=fluistervelden-v8-3-high-hill-double-jump" />
</head>
<body>
  <div id="game"></div>
  <div id="game-ui" aria-hidden="true">
    <div id="refresh-button" role="button" aria-label="Refresh">↻</div>
    <div id="hud-panel">
      <div id="flower-counter">Maanpluis: 0/1</div>
      <div id="hud-subtitle">Vind het eerste maanpluis</div>
    </div>
    <div id="message-panel" class="hidden"></div>
    <div id="finish-panel" class="hidden">
      <div id="finish-title">De maan is wakker 🌙</div>
      <div id="finish-text">Amber heeft het eerste maanpluis gevonden.</div>
    </div>
    <div id="version-label">fluistervelden-prototype-v8.3 HIGH HILL + DOUBLE JUMP</div>
    <div id="touch-controls">
      <div class="control-cluster left-cluster">
        <button class="game-control" data-control="left"><span class="control-icon">‹</span><span class="control-label">LINKS</span></button>
        <button class="game-control" data-control="right"><span class="control-icon">›</span><span class="control-label">RECHTS</span></button>
      </div>
      <div class="control-cluster right-cluster">
        <button class="game-control primary" data-control="jump"><span class="control-icon wing">⌃</span><span class="control-label">SPRING</span></button>
        <button class="game-control flower" data-control="blow"><span class="control-icon">✿</span><span class="control-label">DOE</span></button>
      </div>
    </div>
  </div>
  <script>
    window.FTTM = window.FTTM || {};
    window.FTTM.InputState = { left:false, right:false, jump:false, blow:false };
    window.FTTM.setFlowerCounter = function(value, total) {
      var el = document.getElementById('flower-counter');
      if (el) el.textContent = 'Maanpluis: ' + value + '/' + total;
    };
    window.FTTM.showMessage = function(text, ms) {
      var el = document.getElementById('message-panel');
      if (!el) return;
      el.textContent = text;
      el.classList.remove('hidden');
      clearTimeout(window.FTTM._messageTimer);
      window.FTTM._messageTimer = setTimeout(function(){ el.classList.add('hidden'); }, ms || 2400);
    };
    window.FTTM.showFinishPanel = function() { var el = document.getElementById('finish-panel'); if (el) el.classList.remove('hidden'); };
    window.FTTM.hideFinishPanel = function() { var el = document.getElementById('finish-panel'); if (el) el.classList.add('hidden'); };
    window.addEventListener('load', function () {
      var refresh = document.getElementById('refresh-button');
      if (refresh) refresh.addEventListener('click', function(e) { e.preventDefault(); window.location.reload(); });
      var activePointers = {};
      document.querySelectorAll('[data-control]').forEach(function(button) {
        var key = button.getAttribute('data-control');
        button.addEventListener('pointerdown', function(e) {
          e.preventDefault();
          try { button.setPointerCapture(e.pointerId); } catch(err) {}
          activePointers[e.pointerId] = key;
          window.FTTM.InputState[key] = true;
          button.classList.add('pressed');
        });
        function release(e) {
          e.preventDefault();
          if (activePointers[e.pointerId] === key) {
            delete activePointers[e.pointerId];
            window.FTTM.InputState[key] = false;
            button.classList.remove('pressed');
          }
        }
        button.addEventListener('pointerup', release);
        button.addEventListener('pointercancel', release);
        button.addEventListener('lostpointercapture', release);
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="./src/config.js?v=fluistervelden-v8-3-high-hill-double-jump"></script>
  <script src="./src/levels/level1.js?v=fluistervelden-v8-3-high-hill-double-jump"></script>
  <script src="./src/scenes/BootScene.js?v=fluistervelden-v8-3-high-hill-double-jump"></script>
  <script src="./src/scenes/LevelScene.js?v=fluistervelden-v8-3-high-hill-double-jump"></script>
  <script src="./src/main.js?v=fluistervelden-v8-3-high-hill-double-jump"></script>
</body>
</html>
