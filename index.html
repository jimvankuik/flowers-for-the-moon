<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Flowers to the Moon - v31</title>
  <link rel="stylesheet" href="./style.css?v=v31" />
</head>
<body>
  <div id="game"></div>

  <div id="game-ui" aria-hidden="true">
    <div id="refresh-button" role="button" aria-label="Refresh">↻</div>

    <div id="hud-panel">
      <div id="flower-counter">Pluisbloemen: 0/5</div>
      <div id="hud-subtitle">Verzamel bloemen voor je broer op de maan</div>
    </div>

    <div id="finish-panel" class="hidden">
      <div id="finish-title">Goed gedaan, Amber! 🌙</div>
      <div id="finish-text">Je gaf de pluisbloemen liefdevol aan je broer op de maan.</div>
    </div>
  </div>

  <script>
    window.FTTM = window.FTTM || {};
    window.FTTM.setFlowerCounter = function(value, total) {
      var el = document.getElementById("flower-counter");
      if (el) el.textContent = "Pluisbloemen: " + value + "/" + total;
    };
    window.FTTM.showFinishPanel = function() {
      var el = document.getElementById("finish-panel");
      if (el) el.classList.remove("hidden");
    };
    window.FTTM.hideFinishPanel = function() {
      var el = document.getElementById("finish-panel");
      if (el) el.classList.add("hidden");
    };

    window.addEventListener("contextmenu", function(e) { e.preventDefault(); }, { passive:false });
    window.addEventListener("gesturestart", function(e) { e.preventDefault(); }, { passive:false });
    window.addEventListener("selectstart", function(e) { e.preventDefault(); }, { passive:false });
    window.addEventListener("dragstart", function(e) { e.preventDefault(); }, { passive:false });
    window.addEventListener("touchmove", function(e) { e.preventDefault(); }, { passive:false });

    window.addEventListener("load", function () {
      var refresh = document.getElementById("refresh-button");
      if (refresh) {
        refresh.addEventListener("click", function(e) {
          e.preventDefault();
          window.location.reload();
        });
        refresh.addEventListener("touchstart", function(e) { e.preventDefault(); }, { passive:false });
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="./src/config.js?v=v31"></script>
  <script src="./src/levels/level1.js?v=v31"></script>
  <script src="./src/scenes/BootScene.js?v=v31"></script>
  <script src="./src/scenes/LevelScene.js?v=v31"></script>
  <script src="./src/main.js?v=v31"></script>
</body>
</html>
